<canvas id="c"></canvas>

<div id="wp"><div id="wbox"><div id="wtabs"></div><div id="wgrid"></div><div id="wact"><button id="tf">Test fight</button><button id="tc">Test finisher</button><button id="wx">Close</button></div></div></div>
<div id="promo"><div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const G={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'},V='\uFE0E';
const opp=c=>c=='w'?'b':'w';
const inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
function init(){const b=Array.from({length:8},()=>Array(8).fill(null));
 'RNBQKBNR'.split('').forEach((t,i)=>{b[0][i]='b'+t;b[7][i]='w'+t;b[1][i]='bP';b[6][i]='wP'});
 return{b,t:'w',cr:{wK:1,wQ:1,bK:1,bQ:1},ep:null,hm:0}}
const clone=s=>({b:s.b.map(r=>r.slice()),t:s.t,cr:{...s.cr},ep:s.ep,hm:s.hm});
const N=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]],
 D=[[1,1],[1,-1],[-1,1],[-1,-1]],O=[[1,0],[-1,0],[0,1],[0,-1]];
function attacked(b,r,c,by){
 const d=by=='w'?-1:1;
 for(const dc of[-1,1]){const x=r-d,y=c+dc;if(inb(x,y)&&b[x][y]==by+'P')return true}
 for(const[a,e]of N){const x=r+a,y=c+e;if(inb(x,y)&&b[x][y]==by+'N')return true}
 for(let a=-1;a<=1;a++)for(let e=-1;e<=1;e++){if(!a&&!e)continue;const x=r+a,y=c+e;if(inb(x,y)&&b[x][y]==by+'K')return true}
 for(const[dirs,ts]of[[D,'BQ'],[O,'RQ']])for(const[a,e]of dirs){let x=r+a,y=c+e;
  while(inb(x,y)){const p=b[x][y];if(p){if(p[0]==by&&ts.includes(p[1]))return true;break}x+=a;y+=e}}
 return false}
function pseudo(s,r,c){
 const b=s.b,p=b[r][c],col=p[0],t=p[1],m=[],add=(tr,tc,f)=>m.push({fr:r,fc:c,tr,tc,f});
 if(t=='P'){const d=col=='w'?-1:1,st=col=='w'?6:1,last=col=='w'?0:7;
  const push=(tr,tc,f)=>{if(tr==last)'QRBN'.split('').forEach(q=>m.push({fr:r,fc:c,tr,tc,f,promo:q}));else add(tr,tc,f)};
  if(inb(r+d,c)&&!b[r+d][c]){push(r+d,c);if(r==st&&!b[r+2*d][c])add(r+2*d,c,'dbl')}
  for(const dc of[-1,1]){const x=r+d,y=c+dc;if(!inb(x,y))continue;
   if(b[x][y]&&b[x][y][0]!=col)push(x,y);
   else if(s.ep&&s.ep[0]==x&&s.ep[1]==y)add(x,y,'ep')}}
 else if(t=='N'){for(const[a,e]of N){const x=r+a,y=c+e;if(inb(x,y)&&(!b[x][y]||b[x][y][0]!=col))add(x,y)}}
 else if(t=='K'){for(let a=-1;a<=1;a++)for(let e=-1;e<=1;e++){if(!a&&!e)continue;const x=r+a,y=c+e;if(inb(x,y)&&(!b[x][y]||b[x][y][0]!=col))add(x,y)}
  const h=col=='w'?7:0,o=opp(col);
  if(r==h&&c==4&&!attacked(b,h,4,o)){
   if(s.cr[col+'K']&&b[h][7]==col+'R'&&!b[h][5]&&!b[h][6]&&!attacked(b,h,5,o)&&!attacked(b,h,6,o))add(h,6,'oo');
   if(s.cr[col+'Q']&&b[h][0]==col+'R'&&!b[h][1]&&!b[h][2]&&!b[h][3]&&!attacked(b,h,3,o)&&!attacked(b,h,2,o))add(h,2,'ooo')}}
 else{const dirs=t=='B'?D:t=='R'?O:D.concat(O);
  for(const[a,e]of dirs){let x=r+a,y=c+e;while(inb(x,y)){if(b[x][y]){if(b[x][y][0]!=col)add(x,y);break}add(x,y);x+=a;y+=e}}}
 return m}
function apply(s,m){
 const n=clone(s),b=n.b,p=b[m.fr][m.fc],col=p[0],cap=b[m.tr][m.tc];
 b[m.tr][m.tc]=m.promo?col+m.promo:p;b[m.fr][m.fc]=null;
 if(m.f=='ep')b[m.fr][m.tc]=null;
 if(m.f=='oo'){b[m.tr][5]=b[m.tr][7];b[m.tr][7]=null}
 if(m.f=='ooo'){b[m.tr][3]=b[m.tr][0];b[m.tr][0]=null}
 if(p[1]=='K'){n.cr[col+'K']=0;n.cr[col+'Q']=0}
 const corner=(r,c)=>{if(r==7&&c==0)n.cr.wQ=0;if(r==7&&c==7)n.cr.wK=0;if(r==0&&c==0)n.cr.bQ=0;if(r==0&&c==7)n.cr.bK=0};
 corner(m.fr,m.fc);corner(m.tr,m.tc);
 n.ep=m.f=='dbl'?[(m.fr+m.tr)/2,m.fc]:null;
 n.hm=(p[1]=='P'||cap||m.f=='ep')?0:s.hm+1;n.t=opp(s.t);return n}
function kingPos(b,col){for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]==col+'K')return[r,c]}
const inCheck=(s,col)=>{const[r,c]=kingPos(s.b,col);return attacked(s.b,r,c,opp(col))};
function legal(s,r,c){return pseudo(s,r,c).filter(m=>{const n=apply(s,m);const[kr,kc]=kingPos(n.b,s.t);return!attacked(n.b,kr,kc,opp(s.t))})}
function anyLegal(s){for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(s.b[r][c]&&s.b[r][c][0]==s.t&&legal(s,r,c).length)return true;return false}
function insufficient(b){const x=[];for(const row of b)for(const p of row)if(p&&p[1]!='K')x.push(p[1]);
 return x.length==0||(x.length==1&&'BN'.includes(x[0]))}

// ---------- 3D UI ----------
const T=THREE,$=id=>document.getElementById(id),BY=.06;
const cv=$('c'),renderer=new T.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;

const hemi=new T.HemisphereLight(0xffffff,0x8a8780,.85);scene.add(hemi);
const sun=new T.DirectionalLight(0xffffff,.85);sun.position.set(5,14,7);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:1,far:40});sun.shadow.bias=-.0005;scene.add(sun);
const gc={};const GE=(k,f)=>gc[k]||(gc[k]=f());
// board
const frame=new T.Mesh(new T.BoxGeometry(9.3,.5,9.3),new T.MeshStandardMaterial({color:0x14171c,roughness:.55}));frame.position.y=-.25;frame.receiveShadow=true;scene.add(frame);
const rim=new T.Mesh(new T.BoxGeometry(8.2,.02,8.2),new T.MeshStandardMaterial({color:0x353a42,roughness:.6}));rim.position.y=.005;scene.add(rim);
const grid=new T.Mesh(new T.BoxGeometry(8.06,.04,8.06),new T.MeshStandardMaterial({color:0x17191d,roughness:.7}));grid.position.y=.02;scene.add(grid);
const SQM=[],sqG=new T.BoxGeometry(.985,.06,.985);
for(let r=0;r<8;r++)for(let c=0;c<8;c++){const m=new T.Mesh(sqG,new T.MeshStandardMaterial({color:(r+c)%2?0xa9aaac:0xefefee,roughness:.55}));m.position.set(c-3.5,.03,r-3.5);m.receiveShadow=true;scene.add(m);SQM.push(m)}
const floor=new T.Mesh(new T.PlaneGeometry(60,60),new T.ShadowMaterial({opacity:.2}));floor.rotation.x=-Math.PI/2;floor.position.y=-.501;floor.receiveShadow=true;scene.add(floor);
function label(ch,x,z){const k=document.createElement('canvas');k.width=k.height=64;const x2=k.getContext('2d');x2.fillStyle='#6d7480';x2.font='bold 34px sans-serif';x2.textAlign='center';x2.textBaseline='middle';x2.fillText(ch,32,34);
 const m=new T.Mesh(new T.PlaneGeometry(.34,.34),new T.MeshBasicMaterial({map:new T.CanvasTexture(k),transparent:true}));m.rotation.x=-Math.PI/2;m.position.set(x,.003,z);scene.add(m)}
for(let i=0;i<8;i++){label('abcdefgh'[i],i-3.5,4.38);label(String(8-i),-4.38,i-3.5)}
// pieces
const MAT={w:new T.MeshStandardMaterial({color:0xf5f5f5,roughness:.5,metalness:.05}),b:new T.MeshStandardMaterial({color:0x363a47,roughness:.45,metalness:.15})};
const TRIM={w:new T.MeshStandardMaterial({color:0x0c0c0e,roughness:.45}),b:new T.MeshStandardMaterial({color:0xcaa83c,roughness:.35,metalness:.7})};
const GOLD=new T.MeshStandardMaterial({color:0xd4af37,roughness:.3,metalness:.85}),INK=new T.MeshStandardMaterial({color:0x0a0a0c,roughness:.5});
const OUT=new T.MeshBasicMaterial({color:0x08080a,side:T.BackSide});
OUT.onBeforeCompile=s=>{s.vertexShader=s.vertexShader.replace('#include <begin_vertex>','vec3 transformed=position+normalize(normal)*.022;')};
const blobTex=(()=>{const k=document.createElement('canvas');k.width=k.height=64;const x=k.getContext('2d'),g=x.createRadialGradient(32,32,10,32,32,32);g.addColorStop(0,'rgba(0,0,0,.5)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new T.CanvasTexture(k)})();
const BASE=[[0,0],[.4,0],[.415,.03],[.4,.07],[.36,.1],[.37,.13],[.33,.17],[.3,.21]];
const PROF={P:[[.22,.27],[.14,.4],[.12,.47],[.19,.5],[.16,.54],[0,.56]],
 R:[[.25,.27],[.19,.55],[.27,.62],[.3,.67],[.3,.92],[.22,.92],[.22,.85],[0,.85]],
 B:[[.25,.27],[.13,.62],[.21,.68],[.13,.75],[0,.75]],
 Q:[[.26,.27],[.14,.7],[.23,.78],[.15,.83],[.27,1.0],[.22,1.03],[0,1.03]],
 K:[[.27,.27],[.15,.76],[.25,.84],[.18,.9],[.24,1.08],[0,1.08]],
 N:[[.25,.27],[.2,.3],[0,.3]]};
const RINGS={P:[[.5,.19]],R:[[.64,.28]],B:[[.68,.2]],Q:[[.79,.23]],K:[[.84,.25],[1.03,.235]],N:[[.3,.22]]};
function mesh(g,m,outline=true){const x=new T.Mesh(g,m);x.castShadow=true;if(outline)x.add(new T.Mesh(g,OUT));return x}
function build(p){
 const col=p[0],t=p[1],g=new T.Group(),m=MAT[col],tr=TRIM[col];g.userData.type=t;g.userData.col=col;
 const bl=new T.Mesh(GE('bl',()=>new T.PlaneGeometry(1.25,1.25)),new T.MeshBasicMaterial({map:blobTex,transparent:true,depthWrite:false}));bl.rotation.x=-Math.PI/2;bl.position.y=.004;g.add(bl);
 g.add(mesh(GE('L'+t,()=>new T.LatheGeometry(BASE.concat(PROF[t]).map(a=>new T.Vector2(a[0],a[1])),40)),m));
 const ring=(y,r)=>{const x=mesh(GE('T'+y+r,()=>new T.TorusGeometry(r,.022,8,44)),tr,false);x.rotation.x=Math.PI/2;x.position.y=y;g.add(x)};
 ring(.05,.41);ring(.15,.345);RINGS[t].forEach(a=>ring(a[0],a[1]));
 const add=(geo,mat,x,y,z,sc,ol=true)=>{const o=mesh(geo,mat,ol);o.position.set(x,y,z);if(sc)o.scale.set(...sc);g.add(o);return o};
 const SP=GE('sp',()=>new T.SphereGeometry(1,28,20)),sph=(r,mat,x,y,z,sc,ol)=>add(SP,mat,x,y,z,sc?sc.map(v=>v*r):[r,r,r],ol);
 if(t=='P')sph(.2,m,0,.69,0);
 if(t=='R'){for(let i=0;i<4;i++){const a=i*Math.PI/2+Math.PI/4;const o=add(GE('mer',()=>new T.BoxGeometry(.15,.13,.15)),m,Math.cos(a)*.245,.98,Math.sin(a)*.245);o.rotation.y=-a}
  add(GE('c1',()=>new T.BoxGeometry(.34,.012,.075)),INK,0,.852,0,null,false);add(GE('c2',()=>new T.BoxGeometry(.075,.012,.34)),INK,0,.853,0,null,false)}
 if(t=='B'){sph(.18,m,0,.93,0,[1,1.5,1]);sph(.06,GOLD,0,1.21,0,null,false)}
 if(t=='Q'){for(let i=0;i<10;i++){const a=i*Math.PI/5;sph(.05,GOLD,Math.cos(a)*.245,1.04,Math.sin(a)*.245,null,false)}sph(.09,GOLD,0,1.1,0,null,false)}
 if(t=='K'){add(GE('kv',()=>new T.BoxGeometry(.1,.36,.1)),INK,0,1.27,0);add(GE('kh',()=>new T.BoxGeometry(.29,.1,.1)),INK,0,1.3,0)}
 if(t=='N'){const geo=GE('kn',()=>{const s=new T.Shape();[[-.22,.27],[-.27,.6],[-.16,.84],[-.02,.94],[.06,.86],[.2,.82],[.31,.6],[.3,.5],[.14,.47],[.1,.41],[.22,.27]].forEach((a,i)=>i?s.lineTo(a[0],a[1]):s.moveTo(a[0],a[1]));
   const e=new T.ExtrudeGeometry(s,{depth:.3,bevelEnabled:true,bevelSize:.05,bevelThickness:.05,bevelSegments:4});e.translate(0,0,-.15);return e});
  const h=mesh(geo,m);h.rotation.y=col=='w'?Math.PI/2:-Math.PI/2;g.add(h)}
 return g}
const piecesG=new T.Group(),overG=new T.Group();scene.add(piecesG,overG);
const pos=(r,c)=>new T.Vector3(c-3.5,BY,r-3.5);
const OV=(col,op)=>new T.MeshBasicMaterial({color:col,transparent:true,opacity:op,depthWrite:false});
function flat(geo,col,op,r,c,y=.005){const o=new T.Mesh(geo,OV(col,op));o.rotation.x=-Math.PI/2;o.position.set(c-3.5,BY+y,r-3.5);overG.add(o)}
const glow=(()=>{const k=document.createElement('canvas');k.width=k.height=128;const x=k.getContext('2d'),g=x.createRadialGradient(64,64,4,64,64,64);g.addColorStop(0,'rgba(255,40,40,.95)');g.addColorStop(1,'rgba(255,40,40,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new T.CanvasTexture(k)})();
// ---------- effects ----------
const fxG=new T.Group();scene.add(fxG);
const tgt=new T.Vector3(0,0,.3);
let fxs=[],busy=false,shake=0,cin=null,cinTimer=null,lastCap=null;
const ease=k=>k*k*(3-2*k);
function startMoveAnim(g,m,cap){
 const a=pos(m.fr,m.fc),b=pos(m.tr,m.tc),t0=performance.now();g.position.copy(a);
 if(!cap){anim={update(t){const k=Math.min(1,(t-t0)/280);g.position.lerpVectors(a,b,ease(k));g.position.y=BY+Math.sin(k*Math.PI)*.4;return k>=1}};return}
 busy=true;
 const d=a.distanceTo(b),dir=b.clone().sub(a).normalize(),mid=a.clone().addScaledVector(dir,Math.max(0,d-.95)),vp=pos(cap.r,cap.c);
 const ghost=build(cap.p);ghost.position.copy(vp);fxG.add(ghost);
 let slashed=false,gone=false;
 anim={update(t){const e=t-t0;
  if(e<380){const k=ease(e/380);g.position.lerpVectors(a,mid,k);g.position.y=BY+Math.sin(k*Math.PI)*.25}
  else if(e<800){g.position.copy(mid);
   if(!slashed){slashed=true;weaponFX(wpn(g.userData.col,g.userData.type,false),mid,vp);shake=.09}
   if(e<620){const j=Math.sin(e*.12)*.04;ghost.position.set(vp.x+j,BY,vp.z-j);g.position.x+=Math.sin(e*.15)*.02}
   else if(!gone){gone=true;fxG.remove(ghost);ink(vp);shake=.13}}
  else{const k=Math.min(1,(e-800)/250);g.position.lerpVectors(mid,b,ease(k));g.position.y=BY;if(k>=1){busy=false;return true}}
  return false}}}
function slash(a,b){
 const c=a.clone().add(b).multiplyScalar(.5);c.y=.6;const t0=performance.now();
 const m=new T.Mesh(GE('fan',()=>new T.CircleGeometry(.95,28,0,2.1)),new T.MeshBasicMaterial({color:0xe23a3a,transparent:true,opacity:.9,side:T.DoubleSide,depthWrite:false}));fxG.add(m);
 const L=[];for(let i=0;i<3;i++){const l=new T.Mesh(GE('ln',()=>new T.BoxGeometry(1.6,.012,.012)),new T.MeshBasicMaterial({color:0x08080a,transparent:true}));l.position.set(c.x,.3+i*.2,c.z);l.rotation.set(0,Math.random()*3,(Math.random()-.5)*.8);fxG.add(l);L.push(l)}
 fxs.push(t=>{const k=(t-t0)/420;if(k>=1){fxG.remove(m);L.forEach(l=>fxG.remove(l));return true}
  m.position.copy(c);m.lookAt(cam.position);m.rotateZ(-1.6+k*2.4);m.scale.setScalar(.5+k*.9);m.material.opacity=.9*(1-k*k);
  L.forEach(l=>{l.scale.x=.3+k*1.2;l.material.opacity=1-k});return false})}
const STEEL=new T.MeshStandardMaterial({color:0xc4c8d2,roughness:.25,metalness:.9}),WOOD=new T.MeshStandardMaterial({color:0x2a0c12,roughness:.5}),BLK=new T.MeshStandardMaterial({color:0x0b0b0e,roughness:.4,metalness:.4});
const INKM=new T.MeshPhongMaterial({color:0x050507,shininess:90,specular:0x999999});
const STYLE={Q:{t:'Endless Night',bg:0x7a0b14,e0:'#fde0e4',e1:'#e8808e',w:'rod',ac:0xff2a3a},
 R:{t:'Iron Verdict',bg:0x6b2a08,e0:'#ffe7c9',e1:'#e39a55',w:'sword',ac:0xff8a1a},
 B:{t:'Sacred Spear',bg:0x0d2b66,e0:'#dbe8ff',e1:'#6f97e0',w:'spear',ac:0x4aa0ff},
 N:{t:'Shadow Blade',bg:0x2a0f55,e0:'#eadcff',e1:'#9a78e0',w:'kunai',ac:0xb060ff},
 P:{t:'Humble Fate',bg:0x0f4a2e,e0:'#dcffe9',e1:'#62c08a',w:'dagger',ac:0x30d080},
 K:{t:'Silent Crown',bg:0x2a2a2e,e0:'#eeeeee',e1:'#909098',w:'star',ac:0xdddddd}};
// weapon: tip at origin, handle toward -y

 lastCap=S.b[m.tr][m.tc]?{p:S.b[m.tr][m.tc],r:m.tr,c:m.tc}:m.f=='ep'?{p:S.b[m.fr][m.tc],r:m.fr,c:m.tc}:null;
 hist.push({s:S,last});S=apply(S,m);last=m;sel=null;

 cam.position.set(tgt.x+R*Math.sin(phi)*Math.sin(theta),tgt.y+R*Math.cos(phi),tgt.z+R*Math.sin(phi)*Math.cos(theta));if(shake){cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake}cam.lookAt(tgt)}

const ptrs=new Map();let moved=0,p0=0;
const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1])};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;if(ptrs.size==2)p0=dist()};
cv.onpointermove=e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.abs(dx)+Math.abs(dy);
 if(ptrs.size==1&&moved>8){theta-=dx*.006;phi=Math.min(1.3,Math.max(.2,phi-dy*.005));view()}
 else if(ptrs.size==2){const d=dist();zoom=Math.min(1.6,Math.max(.6,zoom*p0/d));p0=d;view()}};
cv.onpointerup=e=>{const one=ptrs.size==1;ptrs.delete(e.pointerId);if(one&&moved<=8)pick(e)};
cv.onpointercancel=e=>ptrs.delete(e.pointerId);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(1.6,Math.max(.6,zoom*(1+e.deltaY*.001)));view()},{passive:false});
const ray=new T.Raycaster(),plane=new T.Plane(new T.Vector3(0,1,0),-BY);

 ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);

 {const cur=fxs;fxs=[];for(const f of cur)if(!f(t))fxs.push(f)}
